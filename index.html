<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f4eb"><title>世界古迹图 · 中文探索版</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.js"></script><script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script><style>
*{box-sizing:border-box}body{margin:0;color:#29332d;font:14px system-ui,sans-serif;background:#f7f4eb}#map{position:fixed;inset:0}header{position:fixed;top:12px;left:12px;right:12px;max-width:480px;background:#fffcf5;border:1px solid #dad8cc;border-radius:15px;padding:13px;box-shadow:0 3px 20px #0002;z-index:2}h1{margin:0;font-size:20px;letter-spacing:1px}small{color:#626d65}button,input,select{font:inherit;border:1px solid #c7ccc3;border-radius:9px;background:white;color:inherit;padding:9px;min-width:0}button{cursor:pointer}button.primary{background:#28594d;color:white;border:0;font-weight:600}button:disabled{opacity:.55}form,.actions{display:flex;gap:7px;margin-top:9px}form input{flex:1}.filters{display:flex;gap:5px;overflow:auto;padding:8px 0 0}.filters label{white-space:nowrap;background:#eceee7;border-radius:8px;padding:5px 8px;font-size:12px;display:flex;align-items:center;gap:4px}.filters input{accent-color:#28594d;margin:0}#status{font-size:12px;margin-top:8px;line-height:1.4}#tools{display:none;margin-top:9px;max-height:32vh;overflow:auto}#tools.open{display:block}#tools input{width:100%;margin:5px 0}#places{max-height:25vh;overflow:auto}#places button{display:block;text-align:left;width:100%;margin-top:3px}#info{position:fixed;bottom:33px;left:12px;right:12px;max-width:480px;background:#fffcf5;z-index:3;box-shadow:0 2px 18px #0003;border-radius:15px;padding:15px;max-height:43vh;overflow:auto}#info[hidden]{display:none}#info h2{font-size:19px;margin:0 25px 5px 0}#info p{margin:8px 0;overflow-wrap:anywhere}#info a{color:#216b60;display:inline-block;margin:5px 12px 5px 0}#close{float:right;padding:3px 8px}.maplibregl-ctrl-top-right{top:260px}.hint{font-size:12px;color:#626d65}.sw{display:inline-block;border-radius:50%;width:8px;height:8px}#attribution{position:fixed;bottom:0;left:0;background:#fffcf5e8;font-size:10px;z-index:2;padding:3px 6px;max-width:65%;overflow:hidden}#attribution a{color:#315a4e} @media(min-width:800px){header{width:390px}.maplibregl-ctr </style></head><body><div id="map"></div><header><h1>世界古迹图 <small style="font-size:11px">探索版 0.3</small></h1><small>在线探索 · 中文优先 · 底图古迹自动显示</small><form id="search"><input id="query" placeholder="搜索城市或地点" required><button>搜索</button></form><div id="places"></div><div class="actions"><button class="primary" id="load" style="flex:1" disabled>查询当前区域古迹</button><button id="locate">定位</button><button id="more">设置</button></div><div class="filters" id="filters"></div><div id="status" role="status">正在加载底图…</div><div id="tools"><div class="hint">可添加拥有合法访问权限的公开矢量 PMTiles 直链；尚未预接 Heritage Watch AI 瓦片。外部图层不参与上面的分类过滤。</div><input id="tileurl" placeholder="https://…/heritage.pmtiles"><button id="addtile">添加在线图层</button><div id="extra"></div><p class="hint">名称缺失时保留原文；点击古迹可查询 Wikidata 中文资料。数据来自社区，不代表官方文保认定。</p><a href="https://terria-catalog.prod.heritagewatch.ai/tools/" target="_blank" rel="noopener">原版 Heritage Watch AI</a></div></header><section id="info" hidden><button id="close" aria-label="关闭">×</button><div id="detail"></div></section><div id="attribution"><a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap contributors (ODbL)</a> · <a href="https://openfreemap.org/" target="_blank">OpenFreeMap</a></div>
<script>
'use strict';const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;const groups={heritage:['文保','#b5762b'],historic:['古迹','#9c4b32'],ruins:['遗址','#a8753a'],military:['军事','#6a7552'],industry:['工业交通','#65718e'],memorial:['纪念','#8c6e9d'],religion:['宗教','#427e9a'],museum:['博物馆','#39816d'],other:['其他','#727272']};const types={archaeological_site:'考古遗址',castle:'城堡',fort:'堡垒',fortification:'防御工事',citywalls:'城墙',city_gate:'城门',ruins:'废墟',battlefield:'古战场',memorial:'纪念设施',monument:'纪念碑',tomb:'墓葬',manor:'庄园',building:'历史建筑',mine:'历史矿井',railway:'历史铁路',locomotive:'历史机车',ship:'历史船舶',aircraft:'历史飞机',tank:'历史坦克',cannon:'历史火炮',boundary_stone:'界碑',milestone:'里程碑',wayside_cross:'路旁十字架',wayside_shrine:'路旁神龛',church:'教堂',monastery:'修道院',museum:'博物馆',place_of_worship:'宗教场所',lighthouse:'灯塔',yes:'是'};
const selected=new Set(Object.keys(groups).filter(k=>!['religion','museum'].includes(k)));for(const [k,[n,c]] of Object.entries(groups)){const l=document.createElement('label'),i=document.createElement('input'),s=document.createElement('span');i.type='checkbox';i.checked=selected.has(k);s.className='sw';s.style.background=c;l.append(i,s,n);$('filters').append(l);i.onchange=()=>{i.checked?selected.add(k):selected.delete(k);applyFilter()}}let map,proto,ready=false,busy=false,features=[],detailToken=0,extraN=0;const empty=()=>({type:'FeatureCollection',features:[]});const names=['name:zh-Hans','name:zh-CN','name:zh','name_zh','name_zh_hans','name:zh-Hant','name_zh-Hans','name_zh-Hant'];function clean(v){return typeof v==='string'&&v.trim()?v.trim():''}function chinese(p){return names.map(k=>clean(p[k])).find(Boolean)||''}function label(p){return chinese(p)||clean(p.name_zh_hant)||clean(p.name)||clean(p.label)||clean(p.name_en)||clean(p['name:en'])||''}function type(p){return p.historic||p.amenity||p.tourism||p.man_made||p.type||p.kind||p.category||''}function group(p){const h=p.historic||'';if(/fort|battlefield|citywalls|city_gate|tank|cannon|bunker/.test(h))return'military';if(/mine|railway|locomotive|ship|aircraft|technical|industrial/.test(h))return'industry';if(/ruins|archaeological|tomb/.test(h)||p.ruins==='yes'||p.building==='ruins')return'ruins';if(/memorial|monument|boundary_stone|milestone/.test(h))return'memorial';if(h)return'historic';if(p.heritage)return'heritage';if(p.amenity==='place_of_worship'||p.building==='church'||p.building==='cathedral')return'religion';if(p.tourism==='museum')return'museum';return'other'}
function applyFilter(){if(!ready)return;updatePreview();map.getSource('local-heritage').setData({type:'FeatureCollection',features:features.filter(f=>selected.has(f.properties.group))});}function textExpr(){return ['coalesce',...names.map(k=>['get',k]),['get','name'],['get','label'],['get','name_en'],['get','name:en'],'']}
let previewInstalled=false;
const previewKinds={castle:'historic',monument:'memorial',memorial:'memorial',ruins:'ruins',archaeological_site:'ruins',fort:'military',fortification:'military',museum:'museum',place_of_worship:'religion',church:'religion',cathedral:'religion',mosque:'religion',synagogue:'religion',temple:'religion',buddhist:'religion',christian:'religion',muslim:'religion',jewish:'religion',hindu:'religion'};
function previewFilter(){
 const allowed=Object.keys(previewKinds).filter(k=>selected.has(previewKinds[k]));
 return ['any',['in',['get','subclass'],['literal',allowed]],['in',['get','class'],['literal',allowed]]];
}
function updatePreview(){if(previewInstalled){for(const id of ['preview-points','preview-names'])map.setFilter(id,previewFilter())}}
function installPreview(){
 const layer=map.getStyle().layers.find(l=>l['source-layer']==='poi'&&l.source);
 if(!layer){status('底图没有可用的兴趣点图层，仍可手动查询。');return}
 const color=['match',['get','subclass'],'monument','#8c6e9d','memorial','#8c6e9d','ruins','#a8753a','archaeological_site','#a8753a','castle','#9c4b32','#28594d'];
 const common={source:layer.source,'source-layer':'poi',minzoom:12,filter:previewFilter()};
 map.addLayer({id:'preview-points',type:'circle',...common,paint:{'circle-color':color,'circle-radius':5,'circle-stroke-color':'#fff','circle-stroke-width':1.4}},'local-points');
 map.addLayer({id:'preview-names',type:'symbol',...common,minzoom:14,layout:{'text-field':textExpr(),'text-font':layer.layout?.['text-font']||['Noto Sans Regular'],'text-size':12,'text-offset':[0,1],'text-anchor':'top'},paint:{'text-color':'#38423a','text-halo-color':'#fff','text-halo-width':1.5}},'local-points');
 previewInstalled=true;
 map.on('click','preview-points',e=>{if(map.queryRenderedFeatures(e.point,{layers:['local-points']}).length)return;const p=e.features[0].properties;showDetail({...p,kind:p.subclass||p.class,display:label(p)||types[p.subclass]||'底图兴趣点'});addText($('detail'),'p','来源：OpenFreeMap 底图兴趣点（非完整古迹数据库）。')});
}
function init(){if(!window.maplibregl){status('地图组件加载失败，请检查网络或浏览器。');return}try{if(window.pmtiles){proto=new pmtiles.Protocol({metadata:true});maplibregl.addProtocol('pmtiles',proto.tile)}map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[12.49,41.89],zoom:13,localIdeographFontFamily:'sans-serif',attributionControl:true});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');map.on('error',e=>{if(!ready)status('底图尚未加载，请检查网络。');else if(e.error)console.warn(e.error)});map.on('load',()=>{for(const l of map.getStyle().layers){if(l.type!=='symbol'||!l.layout?.['text-field']||!l['source-layer']||!['place','transportation_name','water_name','poi','mountain_peak','park'].includes(l['source-layer']))continue;try{map.setLayoutProperty(l.id,'text-field',['coalesce',...names.map(k=>['get',k]),['get','name:en'],['get','name_en'],['get','name'],l.layout['text-field']])}catch(e){console.warn(l.id,e)}}map.addSource('local-heritage',{type:'geojson',data:empty()});map.addLayer({id:'local-points',type:'circle',source:'local-heritage',paint:{'circle-color':['get','color'],'circle-radius':['interpolate',['linear'],['zoom'],11,3,16,6],'circle-stroke-width':1,'circle-stroke-color':'#fff'}});map.addLayer({id:'local-labels',type:'symbol',source:'local-heritage',minzoom:14,layout:{'text-field':['get','display'],'text-font':['Noto Sans Regular'],'text-size':12,'text-offset':[0,1],'text-anchor':'top'},paint:{'text-color':'#38423a','text-halo-color':'#fff','text-halo-width':1.5}});map.on('click','local-points',e=>showDetail(e.features[0].properties));ready=true;$('load').disabled=false;try{installPreview()}catch(e){console.warn('Preview layer',e)}status(previewInstalled?'底图古迹自动显示（放大至街区）；可补充查询完整 OSM。':'底图就绪；可手动查询 OSM。');map.on('moveend',()=>{if(!busy)status(previewInstalled?'底图古迹随地图加载；可补充查询 OSM。':'地图已移动，可查询当前区域古迹。')});});}catch(e){status('地图初始化失败：'+e.message)}}
$('load').onclick=async()=>{if(!ready||busy)return;const b=map.getBounds(),s=Math.max(-85,b.getSouth()),n=Math.min(85,b.getNorth()),w=b.getWest(),e=b.getEast();if(map.getZoom()<11||n-s>.8||e-w>.8){status('请放大到城市或街区范围再查询（至少 11 级）。');return}if(w< -180||e>180){status('请移动至不跨越国际日期变更线的区域。');return}const bbox=[s,w,n,e].map(x=>x.toFixed(5)).join(',');const q=`[out:json][timeout:25];(nwr[historic](${bbox});nwr[heritage](${bbox});nwr[ruins=yes](${bbox});nwr[building=ruins](${bbox});nwr[amenity=place_of_worship](${bbox});nwr[tourism=museum](${bbox});nwr[man_made=lighthouse](${bbox}););out center 10000;`;busy=true;$('load').disabled=true;status('正在查询当前范围的 OSM 古迹…');try{let d,errors=[];for(const url of ['https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter']){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),16000);try{status('补充查询 OSM：'+new URL(url).hostname+'（最多16秒）');const r=await fetch(url+'?'+new URLSearchParams({data:q}),{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);const v=await r.json();if(v.remark)throw Error(v.remark);if(!Array.isArray(v.elements))throw Error('响应格式错误');d=v;break}catch(err){errors.push(err.message)}finally{clearTimeout(timer)}}if(!d)throw Error(errors.join('；'));features=(d.elements||[]).flatMap(o=>{const lat=o.lat??o.center?.lat,lon=o.lon??o.center?.lon;if(!Number.isFinite(lat)||!Number.isFinite(lon))return[];const p=o.tags||{},g=group(p),t=type(p);return[{type:'Feature',geometry:{type:'Point',coordinates:[lon,lat]},properties:{...p,osm_id:o.id,osm_type:o.type,group:g,color:groups[g][1],display:label(p)||types[t]||groups[g][0],lat,lon}}]});applyFilter();status(`返回 ${features.length} 个地理对象（含隐藏分类）${features.length>=10000?'，达到返回上限，请缩小范围':''}。社区数据可能遗漏或重复。`)}catch(e){status('补充查询失败，底图古迹仍可浏览：'+e.message+'。可稍后重试或缩小范围。')}finally{busy=false;$('load').disabled=false}};
function addText(el,tag,txt){const x=document.createElement(tag);x.textContent=txt;el.append(x);return x}function link(el,title,url){const a=addText(el,'a',title);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}function showDetail(p){const token=++detailToken,el=$('detail');el.replaceChildren();$('info').hidden=false;const head=addText(el,'h2',label(p)||p.display||types[type(p)]||'未命名地点');if(p.name&&p.name!==head.textContent)addText(el,'p','原名：'+p.name);addText(el,'p','分类：'+(types[type(p)]||type(p)||groups[p.group]?.[0]||'外部图层'));if(p.heritage)addText(el,'p','遗产标记：'+p.heritage+'（OSM 标签，不等于已核实保护身份）');if(p.start_date)addText(el,'p','建造或起始时间：'+p.start_date);if(p.description)addText(el,'p',p.description);if(p.osm_type&&p.osm_id)link(el,'OSM 原始条目',`https://www.openstreetmap.org/${p.osm_type}/${p.osm_id}`);const qid=[p.wikidata,p.qid,p.QID,p.id].find(v=>typeof v==='string'&&/^Q\d+$/.test(v));if(qid){link(el,'Wikidata',`https://www.wikidata.org/wiki/${qid}`);const btn=addText(el,'button','查找中文名称及简介');btn.onclick=async()=>{btn.disabled=true;btn.textContent='查询中…';try{const q=new URLSearchParams({action:'wbgetentities',ids:qid,props:'labels|descriptions|sitelinks',languages:'zh-hans|zh-cn|zh|zh-hant',sitefilter:'zhwiki',format:'json',origin:'*'});const r=await fetch('https://www.wikidata.org/w/api.php?'+q,{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error(r.status);const obj=(await r.json()).entities[qid];if(token!==detailToken)return;const zh=o=>['zh-hans','zh-cn','zh','zh-hant'].map(k=>o?.[k]?.value).find(Boolean);const l=zh(obj.labels),d=zh(obj.descriptions);if(l){head.textContent=l;addText(el,'p','中文名称来源：Wikidata')}if(d)addText(el,'p',d);if(obj.sitelinks?.zhwiki)link(el,'中文维基百科','https://zh.wikipedia.org/wiki/'+encodeURIComponent(obj.sitelinks.zhwiki.title));btn.textContent=l||d?'已查询中文资料':'未收录中文名称或简介'}catch(e){btn.disabled=false;btn.textContent='查询失败，重试'}}}else addText(el,'p','此条目没有可识别的 Wikidata 编号。');if(!chinese(p))addText(el,'p','没有原始中文名称时保留原文，不自动编造译名。')}
$('close').onclick=()=>{$('info').hidden=true;++detailToken};$('more').onclick=()=>$('tools').classList.toggle('open');$('locate').onclick=()=>{if(!ready)return;if(!navigator.geolocation){status('此浏览器不支持定位');return}navigator.geolocation.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:14}),()=>status('定位失败或未授权，请使用地点搜索。'),{timeout:10000})};$('search').onsubmit=async ev=>{ev.preventDefault();if(!ready)return;const q=$('query').value.trim();if(!q)return;const el=$('places');el.replaceChildren();status('搜索地点…');try{const r=await fetch('https://nominatim.openstreetmap.org/search?'+new URLSearchParams({q,format:'jsonv2',limit:'5','accept-language':'zh,en'}),{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error(r.status);const d=await r.json();for(const p of d){const btn=addText(el,'button',p.display_name);btn.onclick=()=>{map.flyTo({center:[+p.lon,+p.lat],zoom:13});el.replaceChildren()}}status(d.length?'请选择地点。':'未找到地点。')}catch(e){status('地点搜索暂不可用：'+e.message)}};
$('addtile').onclick=async()=>{if(!ready||!proto){status('地图或 PMTiles 组件未就绪。');return}const url=$('tileurl').value.trim();try{if(new URL(url).protocol!=='https:')throw Error('仅接受 HTTPS 地址');const p=new pmtiles.PMTiles(url);const m=await p.getMetadata();const layers=m.vector_layers;if(!layers?.length)throw Error('未找到矢量图层元数据');proto.add(p);const id='ext'+(++extraN);map.addSource(id,{type:'vector',url:'pmtiles://'+url,attribution:typeof m.attribution==='string'?m.attribution.replace(/<[^>]*>/g,''):'外部 PMTiles'});const ids=[];for(const [i,l] of layers.entries()){for(const [g,t,paint] of [['Point','circle',{'circle-radius':4,'circle-color':'#206a81','circle-stroke-width':1,'circle-stroke-color':'white'}],['Polygon','fill',{'fill-color':'#206a81','fill-opacity':.22}],['LineString','line',{'line-color':'#206a81','line-width':2}]]){const lid=`${id}-${i}-${t}`;map.addLayer({id:lid,type:t,source:id,'source-layer':l.id,filter:['==',['geometry-type'],g],paint});ids.push(lid);map.on('click',lid,e=>showDetail(e.features[0].properties))}const lid=`${id}-${i}-text`;map.addLayer({id:lid,type:'symbol',source:id,'source-layer':l.id,minzoom:13,filter:['==',['geometry-type'],'Point'],layout:{'text-field':textExpr(),'text-font':['Noto Sans Regular'],'text-size':11,'text-offset':[0,1],'text-anchor':'top'},paint:{'text-halo-color':'white','text-halo-width':1,'text-color':'#20566a'}});ids.push(lid)}const row=addText($('extra'),'p',m.name||url);const btn=addText(row,'button','隐藏');let vis=true;btn.onclick=()=>{vis=!vis;for(const lid of ids)map.setLayoutProperty(lid,'visibility',vis?'visible':'none');btn.textContent=vis?'隐藏':'显示'};status('外部图层已注册；实际瓦片显示取决于服务端。')}catch(e){status('外部图层加载失败：'+e.message)}};init();
</script></body></html>
