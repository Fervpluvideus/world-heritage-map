 for(const f of rows.slice(0,cap)){const p=f.properties,btn=addText(el,'button',label(p)||p.display||'未命名地点');addText(btn,'small',(CAT[p.catKey]?.[0]||'类型未明')+' · '+({gone:'已毁／移除',damaged:'受损',ruined:'废墟',unknown:'未标明损毁'}[p.conditionKey]||'')+(p.hasDesignation?' · 有遗产认定记录':'')+' · '+(p.sourceLabel||'原版数据'));btn.onclick=()=>{$('listPanel').hidden=true;map.easeTo({center:f.geometry.coordinates,zoom:Math.max(map.getZoom(),17)});showDetail(p)}}
 if(rows.length>cap)addText(el,'p','列表仅显示距中心最近的 '+cap+' 项；放大地图可查看更多。');
}
$('nearby').onclick=()=>{aggListKey=null;$('listPanel').hidden=!$('listPanel').hidden;if(!$('listPanel').hidden){$('info').hidden=true;renderList()}};

function testGrouping(){const f=(x,y,c)=>({xy:{x,y},properties:{catKey:c}});const a=[f(0,0,'castle'),f(5,3,'castle'),f(6,4,'church'),f(150,0,'castle')];const g=groupPoints(a,15,true,true);if(g.length!==3||g[0].members.length!==2||groupPoints(a,15,true,false).length!==4)throw Error('aggregation test failed')}

function addText(el,tag,txt){const x=document.createElement(tag);x.textContent=txt;el.append(x);return x}function link(el,title,url){const a=addText(el,'a',title);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}function showDetail(p){const token=++detailToken,el=$('detail');$('listPanel').hidden=true;el.replaceChildren();$('info').hidden=false;const head=addText(el,'h2',(p.sourceLabel?.startsWith('Heritage Watch AI')?(p.display||label(p)):(label(p)||p.display))||types[type(p)]||'未命名地点');if(p.name&&p.name!==head.textContent)addText(el,'p','原名：'+p.name);if(p.sourceLabel)addText(el,'p','数据来源：'+p.sourceLabel);addText(el,'p','分类：'+(CAT[p.catKey]?.[0]||types[type(p)]||type(p)||groups[p.group]?.[0]||'外部图层'));if(p.catKey){addText(el,'p','存续状态：'+({gone:'已毁／拆除／移除',damaged:'受损',ruined:'废墟／残迹',unknown:'原数据未标明损毁'}[p.conditionKey]||'未知'));addText(el,'p','遗产认定：'+(p.hasDesignation?'原数据有记录（需核对原始认定）':'原数据未见记录'));}if(p.heritage)addText(el,'p','遗产标记：'+p.heritage+'（OSM 标签，不等于已核实保护身份）');if(p.start_date)addText(el,'p','建造或起始时间：'+p.start_date);if(p.description)addText(el,'p',p.description);if(p.osm_type&&p.osm_id)link(el,'OSM 原始条目',`https://www.openstreetmap.org/${p.osm_type}/${p.osm_id}`);const qid=getQid(p);if(qid){link(el,'Wikidata',`https://www.wikidata.org/wiki/${qid}`);const btn=addText(el,'button','查找中文／英文名称及简介');btn.onclick=async()=>{btn.disabled=true;btn.textContent='查询中…';try{const q=new URLSearchParams({action:'wbgetentities',ids:qid,props:'labels|descriptions|sitelinks',languages:LANGS,sitefilter:'zhwiki',format:'json',origin:'*'});const r=await fetch('https://www.wikidata.org/w/api.php?'+q,{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error(r.status);const obj=(await r.json()).entities[qid];if(token!==detailToken)return;const l=extractLanguage(obj.labels),d=extractLanguage(obj.descriptions);languageCache.set(qid,l);while(languageCache.size>NAME_CACHE_MAX)languageCache.delete(languageCache.keys().next().value);const preferred=label(p);if(preferred){head.textContent=preferred;if(l.simple||l.generic||l.traditional||l.english)addText(el,'p','多语言名称来源：Wikidata / 原始地图数据')}const description=d.simple||d.generic||d.traditional||d.english;if(description)addText(el,'p',description);refreshNameLayers();if(obj.sitelinks?.zhwiki)link(el,'中文维基百科','https://zh.wikipedia.org/wiki/'+encodeURIComponent(obj.sitelinks.zhwiki.title));btn.textContent=(l.simple||l.generic||l.traditional||l.english||description)?'已查询多语言资料':'未收录中文或英文资料'}catch(e){btn.disabled=false;btn.textContent='查询失败，重试'}};if(!firstName(p,simpleNames))btn.click()}else addText(el,'p','此条目没有可识别的 Wikidata 编号。');if(!chinese(p))addText(el,'p','名称优先简体中文、繁体中文、英文；没有译名时保留原名。')}
$('close').onclick=()=>{$('info').hidden=true;++detailToken};$('more').onclick=()=>{const open=$('tools').hidden;$('tools').hidden=!open;$('more').setAttribute('aria-expanded',String(open));$('more').textContent=open?'图层 ▴':'图层 ▾'};$('locate').onclick=()=>{if(!ready)return;if(!navigator.geolocation){status('此浏览器不支持定位');return}navigator.geolocation.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:14}),()=>status('定位失败或未授权，请使用地点搜索。'),{timeout:10000})};$('search').onsubmit=async ev=>{ev.preventDefault();if(!ready)return;const q=$('query').value.trim();if(!q)return;const el=$('places');el.replaceChildren();status('搜索地点…');try{const r=await fetch('https://nominatim.openstreetmap.org/search?'+new URLSearchParams({q,format:'jsonv2',limit:'5','accept-language':'zh,en'}),{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error(r.status);const d=await r.json();for(const p of d){const btn=addText(el,'button',p.display_name);btn.onclick=()=>{map.flyTo({center:[+p.lon,+p.lat],zoom:14});el.replaceChildren()}}status(d.length?'请选择地点。':'未找到地点。')}catch(e){status('地点搜索暂不可用：'+e.message)}};
